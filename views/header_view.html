<!--
  VIEW COMPONENT: Navigation Header
  Design Pattern: MVC (View Layer - views/header_view.html)
-->
<header class="site-header" role="banner">
  <div class="container header-container">
    <a href="#hero" class="brand-logo" title="ADLEY Innovation Studio">
      ADLEY <span class="brand-badge">STUDIO</span>
    </a>

    <!-- Desktop & Mobile Navigation (Driven by CSS Checkbox Hack) -->
    <nav class="nav-desktop" role="navigation" aria-label="Main Navigation">
      <ul class="nav-links">
        <li><a href="#hero" class="nav-link">Trang Chủ</a></li>
        <li><a href="#about" class="nav-link">Giới Thiệu</a></li>
        <li><a href="#team" class="nav-link">Đội Ngũ ADLEY</a></li>
        <li><a href="#projects" class="nav-link">Dự Án</a></li>
        <li><a href="#faq" class="nav-link">Hỏi & Đáp</a></li>
        <li><a href="#contact" class="nav-link">Liên Hệ</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <!-- Pure CSS Dark/Light Theme Button -->
      <label for="theme-toggle" class="theme-btn" title="Chuyển chế độ Sáng / Tối (Pure CSS)">
        <span class="theme-icon-moon">🌙</span>
        <span class="theme-icon-sun">☀️</span>
      </label>

      <!-- Mobile Hamburger Toggle Button -->
      <label for="nav-toggle" class="hamburger-btn" aria-label="Mở Menu Mobile">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </label>
    </div>
  </div>
</header>
